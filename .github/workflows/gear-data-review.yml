name: Gear reference review
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate approved Global reference
        shell: python
        run: |
          import json,pathlib
          m=json.loads(pathlib.Path('docs/gear/manifest.json').read_text())
          r=m['Revision']
          assert isinstance(r,int) and r>0
          assert m['BundleUrl']==f'https://kinwan96.github.io/ezlay/gear/r{r}/gear-reference-r{r}.json'
          source=pathlib.Path(f'docs/gear/r{r}/gear-reference-r{r}.json')
          pathlib.Path('current-reference.json').write_bytes(source.read_bytes())
      - name: Collect public PvE priorities and stage changes
        run: python tools/refresh-gear-priorities.py --reference current-reference.json --tokens docs/gear/stat-tokens.json --output gear-review-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: gear-source-review
          path: gear-review-artifact/
          retention-days: 30
