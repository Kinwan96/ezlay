name: Bug report
description: Help improve EZlay with a reproducible report.
body:
  - type: input
    id: version
    attributes:
      label: EZlay version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened and how can we reproduce it?
      description: Remove personal information. Do not upload raw captures or character databases.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
